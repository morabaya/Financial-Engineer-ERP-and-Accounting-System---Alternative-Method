<div class="container-fluid p-2">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-1"><i class="fas fa-sitemap text-primary me-2"></i> دليل الحسابات المالي (Chart of Accounts)</h4>
            <p class="text-muted mb-0">الهيكل الشجري للحسابات (أصول، خصوم، حقوق ملكية، إيرادات، مصاريف) وفق المعايير المحاسبية الدولية</p>
        </div>
        <div>
            <span class="badge bg-primary px-3 py-2 fs-6" id="total-accounts-count">0 حساب</span>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 140px;">رمز الحساب</th>
                            <th>اسم الحساب بالعربية</th>
                            <th>الاسم بالإنجليزية</th>
                            <th>النوع الرئيسي</th>
                            <th>المستوى</th>
                            <th>قابل للترحيل؟</th>
                        </tr>
                    </thead>
                    <tbody id="accounts-table-body">
                        <tr><td colspan="6" class="text-center py-4">جاري تحميل شجرة الحسابات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
async function loadChartOfAccounts() {
    try {
        const res = await fetch('/api/accounts');
        const accounts = await res.json();
        const tbody = document.getElementById('accounts-table-body');
        document.getElementById('total-accounts-count').innerText = accounts.length + ' حساب';

        if (accounts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">لا توجد حسابات مسجلة</td></tr>';
            return;
        }

        tbody.innerHTML = accounts.map(acc => {
            const indent = '&nbsp;'.repeat((acc.level - 1) * 4);
            const levelIcon = acc.level === 1 ? '📁' : (acc.is_leaf ? '📄' : '📂');
            const leafBadge = acc.is_leaf 
                ? '<span class="badge bg-success">حساب فرعي (يقبل القيود)</span>' 
                : '<span class="badge bg-secondary">حساب رئيسي (تجميعي)</span>';

            const typeColor = {
                'أصول': 'text-primary',
                'خصوم': 'text-danger',
                'حقوق ملكية': 'text-info',
                'إيرادات': 'text-success',
                'مصاريف': 'text-warning'
            }[acc.type] || '';

            return `
                <tr>
                    <td class="fw-bold font-monospace">${acc.code}</td>
                    <td class="${acc.level === 1 ? 'fw-bold fs-6' : ''}">${indent} ${levelIcon} ${acc.name_ar}</td>
                    <td class="text-muted font-monospace">${acc.name_en || '-'}</td>
                    <td class="fw-bold ${typeColor}">${acc.type}</td>
                    <td><span class="badge bg-light text-dark border">مستوى ${acc.level}</span></td>
                    <td>${leafBadge}</td>
                </tr>
            `;
        }).join('');
    } catch(e) {
        document.getElementById('accounts-table-body').innerHTML = '<tr><td colspan="6" class="text-center text-danger">خطأ في تحميل الحسابات</td></tr>';
    }
}
loadChartOfAccounts();
</script>
