<div class="container-fluid p-2">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-1"><i class="fas fa-money-check-alt text-primary me-2"></i> إدارة محفظة الشيكات والبنوك</h4>
            <p class="text-muted mb-0">دورة حياة الشيك الكاملة: (تحت التحصيل &larr; مستحق &larr; محصل بالبنك &larr; مرتجع &larr; مجير لمورد)</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success" onclick="openReceiveCheckModal()">
                <i class="fas fa-arrow-down me-1"></i> استلام شيك وارد (من عميل)
            </button>
            <button class="btn btn-warning" onclick="openIssueCheckModal()">
                <i class="fas fa-arrow-up me-1"></i> تحرير شيك صادر (لمورد)
            </button>
        </div>
    </div>

    <!-- Filter Buttons -->
    <div class="btn-group mb-3" role="group">
        <button type="button" class="btn btn-outline-secondary active" onclick="loadChecks('', this)">جميع الشيكات</button>
        <button type="button" class="btn btn-outline-secondary" onclick="loadChecks('UNDER_COLLECTION', this)">تحت التحصيل</button>
        <button type="button" class="btn btn-outline-secondary" onclick="loadChecks('PAID', this)">محصل / مدفوع</button>
        <button type="button" class="btn btn-outline-secondary" onclick="loadChecks('RETURNED', this)">مرتجع</button>
        <button type="button" class="btn btn-outline-secondary" onclick="loadChecks('ENDORSED', this)">مجير</button>
    </div>

    <!-- Checks Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>رقم الشيك</th>
                            <th>النوع</th>
                            <th>البنك المسحوب عليه</th>
                            <th>الساحب / المستفيد</th>
                            <th>تاريخ الاستحقاق</th>
                            <th>المبلغ</th>
                            <th>الحالة</th>
                            <th>الإجراءات المحاسبية</th>
                        </tr>
                    </thead>
                    <tbody id="checks-table-body">
                        <tr><td colspan="8" class="text-center py-4">جاري تحميل الشيكات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Receive Check -->
<div class="modal fade" id="receiveCheckModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-money-check me-2"></i> استلام شيك وارد من عميل</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="receiveCheckForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">رقم الشيك:</label>
                        <input type="text" id="chk-num" class="form-control" required placeholder="مثال: 0012345">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-7">
                            <label class="form-label fw-bold">المبلغ:</label>
                            <input type="number" step="0.01" id="chk-amount" class="form-control" required placeholder="0.00">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-bold">العملة:</label>
                            <select id="chk-currency" class="form-select">
                                <option value="ILS" selected>شيكل (ILS)</option>
                                <option value="USD">دولار (USD)</option>
                                <option value="JOD">دينار (JOD)</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">البنك المسحوب عليه:</label>
                        <input type="text" id="chk-bank" class="form-control" value="بنك فلسطين" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">العميل (الساحب):</label>
                        <select id="chk-contact" class="form-select" required>
                            <!-- populated -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">تاريخ استحقاق الشيك:</label>
                        <input type="date" id="chk-due-date" class="form-control" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-success" onclick="submitReceiveCheck()">
                    <i class="fas fa-check-circle me-1"></i> استلام وترحيل الشيك
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let allContactsCache = [];

async function loadChecks(status = '', btnElem = null) {
    if (btnElem) {
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        btnElem.classList.add('active');
    }
    try {
        const url = status ? `/api/banking/checks?status=${status}` : '/api/banking/checks';
        const res = await fetch(url);
        const checks = await res.json();
        const tbody = document.getElementById('checks-table-body');

        if (checks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">لا توجد شيكات مسجلة</td></tr>';
            return;
        }

        tbody.innerHTML = checks.map(c => {
            const statusBadge = {
                'تحت التحصيل': 'bg-warning text-dark',
                'مستحق': 'bg-info text-dark',
                'مدفوع': 'bg-success',
                'مرتجع': 'bg-danger',
                'مجير': 'bg-primary'
            }[c.status] || 'bg-secondary';

            const typeLabel = c.type === 'Incoming' ? '<span class="text-success"><i class="fas fa-arrow-down me-1"></i>وارد</span>' : '<span class="text-danger"><i class="fas fa-arrow-up me-1"></i>صادر</span>';

            let actions = '';
            if (c.status === 'تحت التحصيل' || c.status === 'مستحق') {
                actions = `
                    <button class="btn btn-sm btn-outline-success" title="تحصيل بالبنك" onclick="handleCheckAction(${c.id}, 'clear')">
                        <i class="fas fa-check"></i> تحصيل
                    </button>
                    ${c.type === 'Incoming' ? `
                    <button class="btn btn-sm btn-outline-primary" title="تجيير لمورد" onclick="endorseCheckPrompt(${c.id})">
                        <i class="fas fa-share"></i> تجيير
                    </button>` : ''}
                    <button class="btn btn-sm btn-outline-danger" title="إثبات ارتجاع" onclick="handleCheckAction(${c.id}, 'return')">
                        <i class="fas fa-times"></i> إرجاع
                    </button>
                `;
            } else {
                actions = '<span class="text-muted small">مكتمل</span>';
            }

            return `
                <tr>
                    <td class="fw-bold font-monospace text-primary">${c.check_number}</td>
                    <td>${typeLabel}</td>
                    <td>${c.bank_name}</td>
                    <td>${c.drawer_name || c.contact_name || '-'}</td>
                    <td class="fw-bold">${c.due_date}</td>
                    <td class="fw-bold">${Number(c.amount).toLocaleString('en-US', {minimumFractionDigits: 2})} ${c.currency}</td>
                    <td><span class="badge ${statusBadge}">${c.status}</span></td>
                    <td><div class="d-flex gap-1">${actions}</div></td>
                </tr>
            `;
        }).join('');
    } catch(e) {
        document.getElementById('checks-table-body').innerHTML = '<tr><td colspan="8" class="text-center text-danger">خطأ في تحميل الشيكات</td></tr>';
    }
}

async function openReceiveCheckModal() {
    if (allContactsCache.length === 0) {
        const r = await fetch('/api/contacts');
        allContactsCache = await r.json();
    }
    const select = document.getElementById('chk-contact');
    select.innerHTML = allContactsCache.map(c => `<option value="${c.id}">${c.name} (${c.type})</option>`).join('');
    document.getElementById('chk-due-date').value = new Date().toISOString().split('T')[0];
    new bootstrap.Modal(document.getElementById('receiveCheckModal')).show();
}

async function submitReceiveCheck() {
    const checkNo = document.getElementById('chk-num').value;
    const amount = parseFloat(document.getElementById('chk-amount').value);
    const currency = document.getElementById('chk-currency').value;
    const bankName = document.getElementById('chk-bank').value;
    const contactId = document.getElementById('chk-contact').value;
    const dueDate = document.getElementById('chk-due-date').value;

    if (!checkNo || !amount || !dueDate) {
        alert("يرجى ملء جميع الحقول المطلوبة!");
        return;
    }

    try {
        const res = await fetch('/api/banking/checks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                type: 'Incoming',
                check_number: checkNo,
                amount: amount,
                currency: currency,
                bank_name: bankName,
                contact_id: contactId,
                due_date: dueDate
            })
        });
        const d = await res.json();
        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('receiveCheckModal')).hide();
            document.getElementById('receiveCheckForm').reset();
            alert("✅ " + d.message);
            loadChecks();
        } else {
            alert("❌ خطأ: " + d.error);
        }
    } catch(e) {
        alert("❌ خطأ بالاتصال");
    }
}

async function handleCheckAction(checkId, action) {
    if (!confirm(action === 'clear' ? "هل تريد تأكيد إيداع وتحصيل هذا الشيك في الحساب البنكي؟" : "هل تريد إثبات ارتجاع هذا الشيك وإعادة فتح الذمة؟")) return;

    try {
        const res = await fetch(`/api/banking/checks/${checkId}/action`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: action})
        });
        const d = await res.json();
        if (res.ok) {
            alert("✅ " + d.message);
            loadChecks();
        } else {
            alert("❌ خطأ: " + d.error);
        }
    } catch(e) {
        alert("❌ خطأ بالاتصال");
    }
}

async function endorseCheckPrompt(checkId) {
    if (allContactsCache.length === 0) {
        const r = await fetch('/api/contacts');
        allContactsCache = await r.json();
    }
    const suppliers = allContactsCache.filter(c => c.type === 'مورد');
    if (suppliers.length === 0) {
        alert("لا يوجد موردين مسجلين لتجيير الشيك لهم.");
        return;
    }
    const supName = prompt("اكتب اسم المورد المراد تجيير الشيك له:\nالموردون المتاحون: " + suppliers.map(s => s.name).join(' - '));
    if (!supName) return;
    const sup = suppliers.find(s => s.name.includes(supName));
    if (!sup) {
        alert("المورد غير موجود!");
        return;
    }

    const res = await fetch(`/api/banking/checks/${checkId}/action`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'endorse', vendor_id: sup.id})
    });
    const d = await res.json();
    if (res.ok) {
        alert("✅ " + d.message);
        loadChecks();
    } else {
        alert("❌ خطأ: " + d.error);
    }
}

loadChecks();
</script>
